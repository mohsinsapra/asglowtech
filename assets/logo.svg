      <stop offset="0%" stop-color="#FFE9BE"/>
      <stop offset="55%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#C9761A"/>
    </radialGradient>
    <linearGradient id="asg-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E6E78"/>
      <stop offset="38%" stop-color="#D2D2DA"/>
      <stop offset="70%" stop-color="#8B8B95"/>
